# 登录接口按客户端 IP 限流，配合后端的失败锁定防暴力破解
limit_req_zone $binary_remote_addr zone=threadscope_login:10m rate=10r/m;

server {
    listen       80;
    server_name  _;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip — JSON API 响应（大 dump 的线程列表可达数 MB）与前端静态资源压缩
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        application/json application/javascript text/css text/plain image/svg+xml;

    # 安全响应头只加在页面上：location 里一旦有 add_header 就不继承外层的，
    # /api/ 的响应头由后端 Spring Security 设置，这里再加会重复
    # 前端路由 — 所有未匹配的路径回退到 index.html
    location / {
        add_header X-Frame-Options        "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "same-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # index.html 禁缓存：否则发版后浏览器仍引用旧的带 hash 资源，导致白屏
    location = /index.html {
        add_header Cache-Control          "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options        "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "same-origin" always;
    }

    location = /api/v1/auth/login {
        limit_req        zone=threadscope_login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @login_limited;

        proxy_pass         http://backend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Origin            "";
        client_max_body_size 16k;
    }

    location @login_limited {
        default_type application/json;
        return 429 '{"code":"TOO_MANY_REQUESTS","message":"登录请求过于频繁，请稍后再试"}';
    }

    # JFR 上传比线程 Dump 大，读超时也更长
    location /api/v1/jfr/upload {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Origin            "";

        client_max_body_size       512m;
        proxy_connect_timeout      60s;
        proxy_send_timeout         300s;
        proxy_read_timeout         300s;
        proxy_buffering            on;
        proxy_buffer_size          16k;
        proxy_buffers              4 64k;
        proxy_busy_buffers_size    128k;
    }

    # 反向代理后端 API
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 清除 Origin：浏览器对同源 POST 也会带 Origin 头，后端 CORS 白名单
        # 无法预知部署域名/IP，会把这类同源请求判成跨域并返回 403。
        # 经此代理的请求本就同源，交给后端做 CORS 判定没有意义。
        proxy_set_header   Origin            "";

        client_max_body_size       50m;
        proxy_connect_timeout      60s;
        proxy_send_timeout         120s;
        proxy_read_timeout         120s;
        proxy_buffering            on;
        proxy_buffer_size          16k;
        proxy_buffers              4 64k;
        proxy_busy_buffers_size    128k;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
