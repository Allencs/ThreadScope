server:
  port: 8080
  servlet:
    session:
      # 无操作超过该时长需重新登录；Session 存在内存里，后端重启后所有人需要重新登录
      timeout: ${THREADSCOPE_SESSION_TIMEOUT:8h}
      tracking-modes: cookie
      cookie:
        name: THREADSCOPE_SESSION
        http-only: true
        same-site: strict
        # 目前是 HTTP 访问；以后上了 HTTPS 改为 true，cookie 才不会以明文发送
        secure: ${THREADSCOPE_COOKIE_SECURE:false}

spring:
  application:
    name: threadscope
  servlet:
    multipart:
      enabled: true
      # JFR 单独放宽到 512MB；线程 Dump 文本仍在控制器里限制为 50MB
      max-file-size: 512MB
      max-request-size: 512MB
      file-size-threshold: 2KB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/threadscope}
    username: ${SPRING_DATASOURCE_USERNAME:threadscope}
    password: ${SPRING_DATASOURCE_PASSWORD:threadscope}
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

threadscope:
  auth:
    # 库里还没有任何用户时用这组账号创建管理员；密码留空则生成随机临时密码打印到日志，首次登录强制修改
    admin-username: ${THREADSCOPE_AUTH_ADMIN_USERNAME:admin}
    admin-password: ${THREADSCOPE_AUTH_ADMIN_PASSWORD:}
    # 忘记管理员密码时设为 true 并重启，按上面的账号密码重置；用完改回 false
    reset-admin-password: ${THREADSCOPE_AUTH_RESET_ADMIN_PASSWORD:false}
    # 登录失败锁定：同 IP 同账号 / 同 IP / 同账号的失败次数上限，最后一次失败后锁定 lock-minutes 分钟
    max-failures-per-user-and-ip: 5
    max-failures-per-ip: 20
    max-failures-per-user: 50
    lock-minutes: 15
  log:
    # 滚动日志目录。本地 bootRun 由 Gradle 设为仓库根目录 logs/；
    # 容器里由 THREADSCOPE_LOG_DIR=/logs 指向挂载卷。
    dir: ${THREADSCOPE_LOG_DIR:../logs}
  jfr:
    max-upload-mb: 512
    retention-days: 14
    # 虚拟线程超过这个数量后按启动栈聚合，不再逐条返回
    virtual-thread-detail-limit: 5000
    history-buckets: 120
    hotspot-limit: 50
    # 同时解析的 JFR 个数。实测解析一个 360MB 的 .jfr 堆内活跃对象约 500MB，并发数决定堆的峰值
    max-concurrent-parses: 1
  cors:
    # 仅本地开发需要跨域；生产经 nginx 同源代理
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  analysis:
    max-threads-per-dump: 50000
    parse-timeout-seconds: 30
    # 缓存驱逐按"线程总数"加权：所有缓存条目的线程数之和不超过该值 (多快照上传按全部快照累计)
    cache-max-total-threads: 150000
    cache-expire-minutes: 60
    # 默认业务包前缀 (上传时未指定则使用；为空时 JDK/已知框架之外的代码均视为业务代码)
    business-packages: []
    # 健康检查阈值 — 按应用规模调整 (如网关常驻上千线程属正常，可调高 thread-count-*)
    health:
      blocked-ratio-warning: 0.05
      blocked-ratio-critical: 0.15
      block-storm-threshold: 5
      pool-exhaustion-ratio: 0.9
      pool-min-threads: 5
      thread-count-warning: 1000
      thread-count-critical: 3000
      non-daemon-warning: 200
      deep-stack-frames: 500
      io-bottleneck-threshold: 10
      root-blocker-min: 5
      root-blocker-critical: 20
      churn-elapsed-seconds: 60
      churn-min-count: 50
      cpu-hotspot-min-threads: 3
