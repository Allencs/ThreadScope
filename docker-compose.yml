services:
  backend:
    build: ./threadscope-backend
    container_name: threadscope-backend
    restart: unless-stopped
    environment:
      # ExitOnOutOfMemoryError: OOM 时立即退出，由 restart 策略拉起，避免僵死
      - JAVA_OPTS=-Xms512m -Xmx1024m -XX:+ExitOnOutOfMemoryError
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      # 构建上下文是仓库根目录，才能把 docs/jfr-advanced-manual.html 打进前端镜像
      context: .
      dockerfile: threadscope-frontend/Dockerfile
      args:
        # 国内服务器可在 .env 中设置 NPM_REGISTRY=https://registry.npmmirror.com
        - NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: threadscope-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
